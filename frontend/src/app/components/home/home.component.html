<div class="home-container">
   <h2>Welcome, {{ userRole }} {{ userFirstName }} {{ userLastName }}</h2>
      <button (click)="logout()">Logout</button>
   <!-- Display Librarian Dashboard link only if the user is a librarian -->
   @if (isLibrarian) {
      <button [routerLink]="['/librarian-dashboard']">Go to Librarian Dashboard</button>
   }
   <div class="home-page">
      <app-search-bar
         [isHomePage]="isHomePage"
         [selectedModel]="selectedModel"
         [fieldOptions]="fieldOptions"
         [selectedField]="selectedField"
         (searchQuery)="onSearchQueryEmitted($event)"
         (fieldChange)="onFieldChange($event)"
         (itemSelected)="onItemSelected($event)"
      ></app-search-bar>
   </div>
   @if (showModal) {
      <div class="home-modal">
         <app-modal
            [isHomePage]="isHomePage"
            [showModal]="showModal" 
            [modalTitle]="modalTitle"
            [modalContent]="modalContent" 
            [bookId]="selectedItem?.id"
            (closeModal)="closeModal()">
         </app-modal>
      </div>
   }
</div>
