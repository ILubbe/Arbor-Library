
<div class="checkin-checkout-container">
  
    <button (click)="showCheckout = false; showCheckin = true">Check In Book</button>
    <button (click)="showCheckin = false; showCheckout = true">Check Out Book</button>
  
    @if (showCheckin) {
        <app-in></app-in>
    }
    @if (showCheckout) {
        <app-out></app-out>
    }
  </div>
