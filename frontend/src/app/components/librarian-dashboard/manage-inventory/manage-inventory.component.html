<div class="manage-inventory-container">
   <h3>Manage Inventory</h3>
   <div class="form-container">
         <div class="btn-search-container">
         <div class="btn-section">
            <button (click)="addBook()">Add Book</button>
            <button (click)="addGenre()">Add Genre</button>
         </div>
         <div class="inventory-search-container">
            <h3>Search For Books</h3>
            <div class="inventory-search">
               <app-search-bar
                  [isInventoryPage]="isInventoryPage"
                  [isBookSearch]="isBookSearch"
                  [selectedModel]="selectedModel"
                  [fieldOptions]="fieldOptions"
                  [selectedField]="selectedField"
                  (itemSelected)="onItemSelected($event)"
               ></app-search-bar>
            </div>
         </div>
      </div>
      <div class="inventory-modal">
         <app-modal
            [isInventoryPage]="isInventoryPage"
            [isBookDetailsModal]="isBookDetailsModal"
            [isGenreModal]="isGenreModal"
            [showModal]="showModal"
            [modalTitle]="modalTitle"
            [bookDetails]="bookDetails"
            (closeModal)="closeModal()">
         </app-modal>
      </div>
   </div>
</div>
