<div class="checkout-container">
    <h3>Check Out Books</h3>
    <div class="form-container">
        <div class="input-section">
            <h3>Enter a User ID, or search for a User</h3>
            <label for="userId"><h3>User ID:</h3></label>
            <input type="text" id="userId" [(ngModel)]="userId" [value]="userId" placeholder="Enter User ID" required>
            @if (!userId) {
                <app-search-bar
                    [isCheckoutPage]="isCheckoutPage"
                    [isUserSearch]="isUserSearch"
                    [perPage]="perPage"
                    [selectedModel]="selectedUserModel"
                    [fieldOptions]="fieldUserOptions"
                    [selectedField]="selectedUserField"
                    (itemSelected)="onUserItemSelected($event)"
                ></app-search-bar>
            }
        </div>
  
        <div class="input-section">
            <h3>Enter a Book ID, or search for a Book</h3>
            <label for="bookId"><h3>Book ID:</h3></label>
            <input type="text" id="bookId" [(ngModel)]="bookId" [value]="bookId" placeholder="Enter Book ID" required>
            @if (!bookId) {
                <app-search-bar
                    [isCheckoutPage]="isCheckoutPage"
                    [isBookSearch]="isBookSearch"
                    [perPage]="perPage"
                    [selectedModel]="selectedBookModel"
                    [fieldOptions]="fieldBookOptions"
                    [selectedField]="selectedBookField"
                    (itemSelected)="onBookItemSelected($event)"
                ></app-search-bar>
            }
        </div>
    </div>
    @if (userId && bookId) {
        <button (click)="checkoutBook()">Check Out</button>
    }
</div>
